name: TableFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-api:
    name: Build .NET API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: srcTableFlow.Api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TableFlow.Api.csproj

      - name: Build API
        run: dotnet build TableFlow.Api.csproj --configuration Release --no-restore

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./srcTableFlow.Api
          file: ./srcTableFlow.Api/Dockerfile
          push: false
          tags: tableflow-api:ci

  frontend:
  name: Frontend Build
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: tableflow-web

  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tableflow-web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Build frontend
      run: npm run build